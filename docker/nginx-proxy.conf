# Sample nginx reverse proxy for ISPadmin.
#
# The app (Apache inside the container) listens only on 127.0.0.1:8090
# (see docker/ports.conf), so nginx is what exposes it on your domain.
#
# 1. Change server_name to your own domain.
# 2. Save as /etc/nginx/sites-available/ispadmin.conf and symlink it into sites-enabled.
# 3. Disable the stock Debian site so it doesn't swallow your domain:
#       sudo rm /etc/nginx/sites-enabled/default
# 4. Add TLS:
#       sudo certbot --nginx -d ispadmin.example.com
#    Certbot rewrites this file, adds the listen 443 block and the HTTP redirect.

server {
    listen 80;
    server_name ispadmin.example.com;
    client_max_body_size 64m;

    # --- Security headers ---------------------------------------------------
    # HSTS tells browsers to only ever use HTTPS for this host. Only enable it
    # once TLS actually works, otherwise you lock yourself out of plain HTTP.
    # Uncomment after certbot has succeeded:
    # add_header Strict-Transport-Security "max-age=31536000" always;

    add_header X-Frame-Options "SAMEORIGIN" always;      # no framing (clickjacking)
    add_header X-Content-Type-Options "nosniff" always;  # no MIME sniffing
    add_header Referrer-Policy "same-origin" always;     # don't leak URLs to third parties

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # The app uses this to detect HTTPS and mark its session cookie as Secure.
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
