# Static client: ISPadmin itself (the "RADIUS test" button on the Routers page).
client ispadmin-local {
	ipaddr = $ENV{RADIUS_LOCAL_CLIENT}
	secret = $ENV{RADIUS_LOCAL_SECRET}
	shortname = ispadmin
}

# Every other source address is looked up in the `nas` table (sites/ispadmin-clients).
# Unknown addresses get no answer at all.
client nas-from-sql {
	ipaddr = 0.0.0.0/0
	dynamic_clients = ispadmin_clients
	lifetime = 60
}
