<svg xmlns="http://www.w3.org/2000/svg" width="220" height="56" viewBox="0 0 220 56" role="img" aria-label="ISPadmin">
  <!-- Defaultné logo ISPadmin — voľne si ho uprav alebo nahraď vlastným. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f6cb0"/>
      <stop offset="1" stop-color="#1f3a63"/>
    </linearGradient>
  </defs>
  <!-- ikona: router + signál -->
  <g transform="translate(6,10)">
    <rect x="0" y="22" width="36" height="12" rx="3" fill="url(#g)"/>
    <circle cx="7" cy="28" r="2" fill="#fff"/>
    <circle cx="14" cy="28" r="2" fill="#fff" opacity=".7"/>
    <rect x="27" y="25.5" width="6" height="5" rx="1" fill="#fff" opacity=".85"/>
    <path d="M18 16 a 10 10 0 0 1 10 -6" fill="none" stroke="#2f6cb0" stroke-width="3" stroke-linecap="round"/>
    <path d="M18 8 a 18 18 0 0 1 18 -8" fill="none" stroke="#2f6cb0" stroke-width="3" stroke-linecap="round" opacity=".55"/>
  </g>
  <!-- text -->
  <text x="54" y="38" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="800" letter-spacing=".5">
    <tspan fill="#2f6cb0">isp</tspan><tspan fill="#1f3a63">admin</tspan>
  </text>
</svg>
